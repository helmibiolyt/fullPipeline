entrypoint: ema_downloader.py
# Raw PDFs are stored as-is for the vector store; the PDF->LLM->CSV path has
# been removed from the scraper entirely, so no API key is involved.
# --download-all-tables exports the 10 additional EMA Excel tables (shortages,
# orphans, referrals, PIPs, ...) to CSV; without it ema_data/additional_tables/
# is declared below but never populated.
args: "--save-pdfs --download-all-tables"
in_place: true
output_subdirs: [ema_data, ema_data/pdfs, ema_data/additional_tables]
size_class: heavy
timeout_min: 720
# INCREMENTAL. The previous crawl covered only 1,364 of the 2,730 medicines in
# ema_medicines.csv, so ~10,000 documents were never fetched (13,333 in S3 vs
# 23,391 in the old lake). hydrate restores the 3 MB document index; the scraper
# seeds it into its checkpoint DB, re-crawls all 2,730 medicines, and downloads
# only documents it does not already hold.
hydrate: [ema_data/ema_documents.csv]
# MUST stay false: the run deliberately re-uploads only new PDFs, so a
# full-replace commit would delete the 13,333 it skipped.
mirror: false
enabled: false