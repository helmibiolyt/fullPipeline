args: "--save-pdfs --skip-llm"
in_place: true
output_subdirs: [ema_data, ema_data/pdfs, ema_data/additional_tables]
size_class: heavy
timeout_min: 720
mirror: true
enabled: false   # TEMP: committed to S3 already — skip this recovery run
