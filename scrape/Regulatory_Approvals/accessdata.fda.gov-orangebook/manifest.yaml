# Multi-step tool: run_all.py runs download -> parse -> unified in sequence.
entrypoint: run_all.py
in_place: true
output_subdirs: [orangebook_data]
size_class: medium
timeout_min: 120
mirror: true
# GATED: the Orange Book product ZIP is served from www.fda.gov/media/76860/download,
# which returns 404 to this host (Akamai blocks the datacenter IP — every www.fda.gov
# path 404s here, while accessdata.fda.gov/api.fda.gov work). Nothing in the code can
# fix an IP-level block. Re-enable once run from an allowed network / egress IP.
enabled: false
