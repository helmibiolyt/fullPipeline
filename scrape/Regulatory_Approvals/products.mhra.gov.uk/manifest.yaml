entrypoint: mhra_downloader.py
# Raw PDFs + metadata CSVs (mhra_documents.csv, raw_metadata.csv). The
# PDF->LLM->CSV path has been removed from the scraper, so no API key is used.
args: "--download-pdfs"
in_place: true
output_subdirs: [mhra_data, mhra_data/pdfs]
size_class: medium
# Downloads raw PDFs for all MHRA products — a large, resumable crawl (checkpoint.json).
# 0 = no time limit: never kill it while it's still making progress.
timeout_min: 0
mirror: true
enabled: false
