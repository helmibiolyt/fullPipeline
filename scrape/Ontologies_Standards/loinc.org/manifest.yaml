entrypoint: loinc_downloader.py
# Mode required: 'crawl' scrapes public LOINC pages unauthenticated (no login).
# ('bulk-download' needs a LOINC account.)
args: "crawl"
in_place: true
output_subdirs: [loinc_data]
size_class: medium
# Crawls up to 7,500 codes (NLM discovery API cap) at ~45 codes/min => ~170 min,
# which all but touched the old 180 limit. 360 leaves headroom; the crawl is
# resumable via loinc_progress.json, so a kill only ever costs the current code.
timeout_min: 360
# Restored before scraping: loinc_progress.json marks which codes are already
# crawled, so the CSV those codes live in has to come back with it — otherwise
# the run emits a near-empty file over the existing one.
hydrate: [loinc_data/loinc_crawled_codes.csv]
# Additive, and it must stay that way: the 1 GB LOINC bulk release also lives
# under loinc_data/ and a full-replace commit would delete all 74 of those files,
# since a crawl-mode run never reproduces them.
mirror: false
# DISABLED: crawl mode is redundant and cannot get past the site anyway.
#
# S3 already holds the official bulk release - 76 files, 1.0 GB, including
# LoincTable/Loinc.csv at 82 MB with all ~100,000 codes across 40 columns.
# Every field the crawler scrapes from web pages is already in that table under
# LOINC's own column names (TIME_ASPCT, SCALE_TYP, METHOD_TYP, RELATEDNAMES2).
# loinc_crawled_codes.csv, the entire product of crawl mode, is 10 rows.
#
# Meanwhile loinc.org sits behind Wordfence and 403s the crawler: 7,500 of 7,500
# requests failed on 2026-07-26, and a browser User-Agent did not change that.
# Running it weekly means re-earning an IP block to collect nothing.
#
# The bulk release changes roughly twice a year and needs an account plus a
# captcha, so refreshing it is a deliberate manual step:
#   python loinc_downloader.py bulk-download --username <u> --password <p>
# Re-enable only when that is wired up; do NOT re-enable crawl mode.
enabled: false
xvfb: true                    # headful browser -> run under xvfb-run
