entrypoint: mesh_downloader.py
# --include-scr adds Supplemental Concept Records (mesh_supplemental_concepts.csv,
# ~36 MB). Without it MeSH publishes descriptors/qualifiers/pharm-actions only.
args: "--include-scr"
in_place: true
output_subdirs: [mesh_data]
size_class: medium
timeout_min: 180
mirror: true
enabled: true
