# run_all.py = download-db, then export the graph-relevant tables to CSV.
# chembl_downloader.py alone only writes a ~20 GB SQLite file, which is not a
# publishable artifact, so the run failed at collect with "produced no
# artifacts" — the reason the only ChEMBL data in S3 is 55.9 KB of samples.
entrypoint: run_all.py
in_place: true
output_subdirs: [chembl_data]
size_class: heavy
timeout_min: 720
mirror: true
# Bulk-DB source: chembl_37_sqlite.tar.gz is 5.37 GB compressed and expands to
# ~20 GB of SQLite before CSV extraction — expect ~30 GB peak disk.
# Enabled: this is the last real data gap. Without it TARGETS, HAS_MECHANISM,
# INDICATED_FOR and HAS_MODALITY rest on opentargets alone (6 therapeutic areas).
enabled: true
