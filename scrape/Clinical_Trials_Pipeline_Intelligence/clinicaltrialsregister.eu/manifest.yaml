entrypoint: run_all.py
in_place: true
output_subdirs: [eu_ctr_trials]
size_class: medium
# ~2000 text pages (whole EU CTR corpus); resumes from existing page_*.txt.
# 0 = no time limit: never kill it while it's still making progress.
timeout_min: 0
mirror: true
enabled: false                # Re-scraped 2026-08-06 and disabled again the
                              # same day. Note for anyone tempted to repeat it:
                              # the sponsor and product columns were NOT missing
                              # from the old file. They are namespaced
                              # "Sponsor 1 - B.1.1 ..." / "IMP 1 - D.3.1 ...",
                              # so a check for columns starting "B." or "D."
                              # missed them. That was a loader gap, not a
                              # scraping one - see graph/trials.py.
