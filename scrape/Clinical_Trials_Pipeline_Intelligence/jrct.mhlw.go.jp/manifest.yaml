entrypoint: jrct_downloader.py
# GATED: source blocks this host's datacenter IP (403). Tor is unreliable here too —
# jrct actively blocks most Tor exit nodes, so scraping only succeeds on the rare
# allowed exit. Needs a residential/allowlisted proxy for reliable scraping; then run
# with:  args: "--proxy <proxy-url> --timeout 90"  (scraper's static-proxy handling is
# already fixed). Existing data lives in S3 under "Clinical Trials & Pipeline
# Intelligence/jrct_trials/".
# args: "--proxy socks5h://tor:9050 --timeout 90"
in_place: true
output_subdirs: [jrct_trials]
size_class: medium
timeout_min: 360
# Restored before scraping: jrct_ids.txt is the completed-ID list.
# Without it the scraper's surviving state points at files that are gone,
# and it would publish a partial dataset over a good one.
hydrate: [jrct_trials/]
mirror: false
# Verified reachable without a proxy (the old 403 was datacenter-IP only).
#
# Re-verified from the Airflow host on 2026-08-06 before enabling, because the
# comment above and the GATED note above THAT contradict each other:
#     search page                  HTTP 200, 126,353 bytes
#     en-latest-detail/jRCT1020260019  HTTP 200,  21,263 bytes
#     en-latest-detail/jRCT1042260071  HTTP 200,  25,452 bytes
# So the WAF no longer blocks this IP and no proxy is needed.
#
# Re-scraped 2026-08-07: 478 -> 2,492 trials, published and disabled again.
#
# Note for next time: jRCT publishes NO phase field - not badly, at all, in any
# of its 80 columns. The graph reads it out of the title instead, where jRCT
# states it in the standard trial-title form ("A phase I open-label study..."),
# which covers 30.9% of them. See _jrct_phase in graph/trials.py.
enabled: false
