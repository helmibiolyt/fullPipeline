entrypoint: run_all.py
in_place: true
output_subdirs: [ctri_trials]
size_class: heavy
timeout_min: 1200
# Restored before scraping: completed trial IDs are read back out of this CSV.
# Without it the scraper's surviving state points at files that are gone,
# and it would publish a partial dataset over a good one.
hydrate: [ctri_trials/ctri_trials.csv]
mirror: false
enabled: false
