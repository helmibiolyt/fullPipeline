entrypoint: clinicaltrials_gov_downloader.py
# No threading: the API returns 1000 full studies per request (bulk-efficient);
# per-study threading would balloon ~500 requests into ~500k. Cursor paging is sequential.
in_place: true
output_subdirs: [clinicaltrials_data]
size_class: heavy
timeout_min: 360
mirror: true
# TEMPORARY: refresh run. Set back to false once it has published.
# 596,751 trials at 1,000 studies per request is ~600 sequential cursor
# pages, and size_class is heavy with a 6-hour ceiling.
enabled: true
