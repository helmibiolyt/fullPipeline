entrypoint: clinicaltrials_gov_downloader.py
# No threading: the API returns 1000 full studies per request (bulk-efficient);
# per-study threading would balloon ~500 requests into ~500k. Cursor paging is sequential.
in_place: true
output_subdirs: [clinicaltrials_data]
size_class: heavy
timeout_min: 360
mirror: true
# Refreshed 2026-08-13 and disabled again the same day. The run took ~14
# minutes against a 360-minute ceiling: the API returns 1,000 full studies per
# request, so the whole registry is ~600 sequential pages, not a long crawl.
# Refreshed again 2026-08-19 to test an unattended graph_sync rebuild on the
# new 8 GB EC2 host, then disabled. That run is why build-graph.sh stops Neo4j
# on a small host: the rebuild it triggered was OOM-killed because the guard
# sat in rebuild-graph.sh, which Airflow never calls. Re-run afterwards took
# 45 min (35 build + 10 import) and published 599,346 ct.gov trials.
enabled: false
