# The pipeline auto-discovers this file. Topic and source come from the folder
# path (scrape/<Topic>/<source>/), so they are NOT repeated here.
entrypoint: run_all.py
in_place: true
output_subdirs: [europe_pmc]
size_class: heavy              # full-text XML fetch + multi-LLM extraction; large/slow
timeout_min: 360
mirror: false                  # cursor-based resume + de-dup; additive/incremental
enabled: false
