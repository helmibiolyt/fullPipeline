entrypoint: medrxiv_downloader.py
args: "--threads 5"   # parallel page-offset fetches (~5 req/s cap)
in_place: true
output_subdirs: [medrxiv]
size_class: small
timeout_min: 60
# Restored before scraping: completed DOIs are read back out of this CSV.
# Without it the scraper's surviving state points at files that are gone,
# and it would publish a partial dataset over a good one.
hydrate: [medrxiv/medrxiv_metadata.csv]
mirror: false
enabled: true