# The pipeline auto-discovers this file. Topic and source come from the folder
# path (scrape/<Topic>/<source>/), so they are NOT repeated here.
entrypoint: openalex_downloader.py
# Scope: Health Sciences (domain 4) from 2021 on. Unfiltered, the query matches
# 52M works - about 173 hours of crawling, which no schedule absorbs. The year
# cut takes that to 11.4M without excluding any kind of work: type filtering was
# considered and rejected, since the genuinely useless types (peer-review
# reports, supplementary material, errata) are only ~4.5%, while `review` is the
# single most valuable type here. Anything unwanted is cheaper to drop at graph
# load time than to re-crawl for.
#
# Passing both years also switches the scraper from one sequential stream to six
# per-year partitions crawled in parallel, each with its own cursor, so a run
# that is cut short resumes per year rather than from the top.
args: "--start-year 2021 --end-year 2026 --threads 6"
in_place: true
output_subdirs: [openalex]
size_class: medium             # slow multi-year API crawler over biomedical works
timeout_min: 360
# INCREMENTAL, and it has to be. Even scoped to 2021+ the query matches 11.4M
# works, which is more than one run can finish. The scraper already keeps a
# cursor per partition in openalex_works_progress.json and knows how to continue
# from it; what was missing is that nothing restored that cursor, so every run
# started at page 1, ran to the timeout and committed nothing. hydrate brings
# back the CSV and the cursors, and each run advances the crawl further.
# The pre-2021 rows already in the CSV are kept - they cost nothing and are real
# works. The old unscoped crawl and the 2021+ one did overlap - a cursor
# belongs to one query and knows nothing about another - which produced 93,431
# duplicate openalex_id values, every one of them a 2021-or-later work. Those
# were removed before the commit, so what is in S3 is deduplicated. Note the
# scraper itself has no works-level dedup, only for authors/institutions, so
# changing the query scope again would reintroduce them.
hydrate: [openalex/openalex_works.csv, openalex/openalex_works_progress.json]
# MUST stay false. Under full-replace a run that is killed at the timeout
# publishes only what it managed this session: 1.7 GB against the 2.38 GB
# already in S3 is a 0.71 ratio, which clears MIN_COMPLETENESS_RATIO and would
# have silently replaced the larger file with the smaller one.
mirror: false
# DISABLED: all fifteen API keys report "Insufficient budget ... you only
# have $0 remaining". No run can harvest anything until credits are topped
# up, and leaving it enabled would re-upload 18.83 GB every week for no new
# data. 9,662,165 works are committed; openalex_works_progress.json is in S3
# and hydrated, so a future run resumes from the saved per-year cursors
# instead of re-crawling. Roughly 2.75M works remain, about $2.75 of credit.
enabled: false